name: Update stats cards

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch cards
        run: |
          mkdir -p assets

          fetch () {
            url="$1"
            out="$2"
            tmp="$(mktemp)"
            if curl -sf --max-time 30 "$url" -o "$tmp"; then
              if grep -q "<svg" "$tmp" && ! grep -qi "went wrong\|rate limit\|error" "$tmp"; then
                mv "$tmp" "$out"
                echo "updated $out"
                return
              fi
            fi
            echo "skipped $out (service unavailable, keeping previous version)"
          }

          fetch "https://github-readme-stats.vercel.app/api?username=duartebred&show_icons=true&hide_title=true&hide_rank=true&hide=contribs&theme=github_dark&hide_border=true" assets/stats.svg
          fetch "https://github-readme-stats.vercel.app/api/top-langs/?username=duartebred&layout=compact&langs_count=6&hide=html,tex,css&theme=github_dark&hide_border=true" assets/top-langs.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: refresh stats cards" && git push
