name: Update stats cards

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch cards
        run: |
          mkdir -p assets

          fetch () {
            url="$1"
            out="$2"
            for attempt in 1 2 3; do
              tmp="$(mktemp)"
              code="$(curl -s -w '%{http_code}' --max-time 30 "$url" -o "$tmp" || echo "000")"
              size="$(wc -c < "$tmp")"
              echo "[$out] attempt $attempt -> HTTP $code, $size bytes"
              echo "[$out] first bytes: $(head -c 200 "$tmp" | tr -d '\n')"

              if [ "$code" = "200" ] && grep -q "<svg" "$tmp" && ! grep -q "Something went wrong" "$tmp"; then
                mv "$tmp" "$out"
                echo "[$out] UPDATED"
                return 0
              fi

              [ "$attempt" -lt 3 ] && sleep 20
            done
            echo "[$out] SKIPPED - keeping previous version if it exists"
            return 0
          }

          fetch "https://github-readme-stats.vercel.app/api?username=duartebred&show_icons=true&hide_title=true&hide_rank=true&hide=contribs&theme=github_dark&hide_border=true" assets/stats.svg
          fetch "https://github-readme-stats.vercel.app/api/top-langs/?username=duartebred&layout=compact&langs_count=6&hide=html,tex,css&theme=github_dark&hide_border=true" assets/top-langs.svg

      - name: Commit if changed
        run: |
          if [ -z "$(ls -A assets 2>/dev/null)" ]; then
            echo "No cards were generated, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh stats cards"
            git push
          fi
